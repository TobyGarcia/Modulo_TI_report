<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta id="theme-color-meta" name="theme-color" content="#1d4ed8" />
    <title id="page-title">Sistema de Inventario & Etiquetas QR</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
    <script>
      // No altera el funcionamiento normal en navegador; al ejecutarse dentro de
      // Teams registra la página como contenido de una pestaña.
      if (window.microsoftTeams?.app) {
        window.microsoftTeams.app.initialize().catch((err) =>
          console.warn('No se pudo inicializar el contexto de Teams:', err)
        );
      }
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
