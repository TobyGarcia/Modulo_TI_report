services:
  - type: web
    name: sistema-qr-inventario
    env: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install --include=dev && cd ../frontend && npm install --include=dev && npm run build
    startCommand: cd backend && node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "*"
