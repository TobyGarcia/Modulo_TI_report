services:
  # Servidor PostgreSQL para DataGrip y la Aplicación
  postgres:
    image: postgres:16-alpine
    container_name: inventario_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-inventario_qr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-inventario_qr}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Node.js / Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventario_backend
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-inventario_qr}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-8f9a2b4c6e8d0f1a3b5c7e9f0a2b4c6e8d0f1a3b5c7e9f0a2b4c6e8d0f1a3b5c}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend React (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventario_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
      - VITE_NGROK_DOMAIN=${NGROK_DOMAIN}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Servicio de Ngrok con autocommit/pooling activado para permitir reconexiones instantáneas
  ngrok:
    image: ngrok/ngrok:latest
    container_name: inventario_ngrok
    restart: always
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=${NGROK_DOMAIN}"
      - "--pooling-enabled"
      - "frontend:5173"
    ports:
      - "4040:4040"
    depends_on:
      - frontend

volumes:
  postgres_data:
